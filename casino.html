<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1A0B0E">
<meta name="mobile-web-app-capable" content="yes">

<title>Casino Four</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Limelight&display=swap">
<style>
/* Layout: one dark casino-floor world; setup and lobby panels sit centred above the same felt table */
:root{--bg:#1A0B0E;--panel:#241216;--gold:#FAC775;--gold-d:#854F0B;--cream:#F4EBD9;--muted:#B4B2A9;--red:#A32D2D;--danger:#F09595;--line:rgba(250,199,117,.28);--ink:#111;
--display:"Limelight",Georgia,serif;--body:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--serif:Georgia,"Times New Roman",serif;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{overflow-x:hidden}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--cream);font-family:var(--body);font-size:15px;line-height:1.45;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{max-width:760px;margin:0 auto}
button{font:inherit;cursor:pointer;padding:8px 16px;border-radius:8px;border:1px solid var(--gold-d);background:var(--ink);color:var(--gold);display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:hover:not(:disabled){background:#1f1214}
button:disabled{opacity:.45;cursor:default}
button.pri{background:var(--gold);color:var(--ink);border-color:var(--gold);font-weight:600}
button.pri:hover:not(:disabled){background:#ffd894}
input,select{font:inherit;font-size:16px;width:100%;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:#120709;color:var(--cream)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--gold)}
input::placeholder{color:#7d6f68}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
svg.i{width:18px;height:18px;flex-shrink:0}
.setup{max-width:520px;margin:0 auto;display:grid;gap:16px}
.brand{font-family:var(--display);font-weight:400;font-size:44px;line-height:1;color:var(--gold);letter-spacing:5px}
.lede{color:var(--muted);text-wrap:pretty}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button[aria-selected=true]{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px}
.lbl{font-size:13px;color:var(--muted);letter-spacing:.3px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>input{flex:1;min-width:0}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;letter-spacing:2px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.err{font-size:13px;color:var(--danger);min-height:18px}
.flash{background:#3a1418;border:1px solid var(--red);border-radius:10px;padding:10px 14px;font-size:14px}
.code{font-family:var(--display);font-size:46px;letter-spacing:12px;color:var(--gold);line-height:1}
.note{font-size:13px;color:var(--muted)}
ol.steps{display:grid;gap:8px;padding-left:20px;font-size:14px}
pre{background:#0d0507;border:1px solid var(--line);border-radius:8px;padding:8px 12px;overflow-x:auto;font-size:13px;color:var(--gold)}
.plist{display:grid;gap:8px}
.pl{display:flex;gap:10px;align-items:center}
.pl small{color:var(--muted)}
.chk{display:flex;gap:8px;align-items:center;font-size:14px}
.board{transform:scale(var(--fit,1));transform-origin:top center;margin-bottom:calc(530px * (var(--fit,1) - 1));touch-action:manipulation;position:relative;height:530px;background:#2A0E12;border-radius:16px;overflow:hidden;color:var(--cream);font-family:var(--body)}
.bk{background-color:var(--back,#9B2C2C);background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.2) 0 1.5px,transparent 1.5px 7px),repeating-linear-gradient(-45deg,rgba(255,255,255,.2) 0 1.5px,transparent 1.5px 7px);border:3px solid #FFFDF7;border-radius:6px;box-sizing:border-box;flex-shrink:0;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.cd{position:relative;width:66px;height:94px;border-radius:6px;background:#FFFFFF;border:1px solid #CFCFCF;box-sizing:border-box;font-weight:700;font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;user-select:none;flex-shrink:0;box-shadow:0 1px 2px rgba(0,0,0,.25),0 3px 8px rgba(0,0,0,.3)}
.hand .cd.dim{filter:brightness(.6)}
.pendpill{position:relative;font-size:11px;font-weight:600;letter-spacing:1px;background:#A32D2D;color:#FFFDF7;border-radius:10px;padding:2px 10px;border:1px solid #FAC775}
.suitpick{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:8;background:#1A1420;border:2px solid #FAC775;border-radius:12px;padding:12px 14px;display:grid;gap:10px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.suitpick button{width:54px;height:54px;font-size:30px;background:#fff;border-color:#CFCFCF;padding:0}
.toppick #tpx{width:auto;height:auto;font-size:13px;padding:6px 16px;background:transparent;color:#FAC775;border:1px solid #854F0B;border-radius:8px}.toppick .tpk{width:auto;height:auto;padding:0;background:none;border:0;border-radius:6px}.toppick .tpk .cd{cursor:pointer;--y:0px;--r:0deg}.toppick .tpk:hover .cd,.toppick .tpk:focus-visible .cd{transform:translateY(-4px);outline:2px solid #FAC775}
.suitpick button:hover:not(:disabled){background:#f1f1f1}
.games{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gp{flex-direction:column;align-items:flex-start;text-align:left;padding:12px 14px;gap:2px}
.gp b{font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:1px}
.gp span{font-size:12px;color:var(--muted);line-height:1.35}
.gp[aria-pressed=true]{border-color:var(--gold);background:#2f1a10;box-shadow:inset 0 0 0 1px var(--gold)}
details.rules{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
details.rules summary{cursor:pointer;color:var(--gold);font-size:14px}
details.rules ul{display:grid;gap:6px;padding-left:18px;margin-top:10px;font-size:14px}
details.rules b{color:var(--gold)}
.ix{position:absolute;top:3px;left:4px;font-size:14px;line-height:.95;text-align:center;letter-spacing:-1px;min-width:11px}
.ix i{font-style:normal;display:block;font-size:12px;letter-spacing:0}
.ix.br{top:auto;left:auto;bottom:3px;right:4px;transform:rotate(180deg)}
.pa{position:absolute;left:14px;right:14px;top:8px;bottom:8px}
.hand .cd{pointer-events:auto;transition:transform .15s;transform:translateY(var(--y)) rotate(var(--r))}
.hand.live .cd{cursor:grab;touch-action:none;-webkit-user-select:none;-webkit-touch-callout:none}
.cd.ghost{box-shadow:0 14px 28px rgba(0,0,0,.55);transition:none;animation:none}
.hand.live .cd:hover{transform:translateY(calc(var(--y) - 10px)) rotate(var(--r))}
.hand .cd.sel{transform:translateY(calc(var(--y) - 20px)) rotate(var(--r));outline:3px solid #FAC775}
.fly{animation:fly .5s ease-out}
@keyframes fly{from{translate:0 -240px;scale:.6;opacity:0}to{translate:0 0;scale:1;opacity:1}}
.flip{animation:flip .4s ease-out both}
@keyframes flip{from{rotate:y 90deg}to{rotate:y 0deg}}
.land{animation:land .35s ease-out}
@keyframes land{from{scale:1.5;rotate:-25deg;opacity:.2}to{scale:1;rotate:0deg;opacity:1}}
.dz{position:relative;width:76px;height:104px;border:2px dashed rgba(250,199,117,.55);border-radius:10px;display:flex;align-items:center;justify-content:center}
.dz.over{background:rgba(250,199,117,.15)}
.av{border-radius:50%;overflow:hidden;border:3px solid #FAC775;box-sizing:border-box;position:relative;box-shadow:0 2px 6px rgba(0,0,0,.5);flex-shrink:0}
.av svg{display:block;width:100%;height:100%}
.pulse{animation:pulse 1.4s ease-out infinite;overflow:visible}
@keyframes pulse{0%{outline:3px solid rgba(250,199,117,.95);outline-offset:0}100%{outline:3px solid rgba(250,199,117,0);outline-offset:12px}}
.chair{position:absolute;left:50%;top:-12px;transform:translateX(-50%);width:72px;height:72px;border-radius:24px 24px 8px 8px;background:var(--chair,#791F1F);border:3px dotted #FAC775;box-sizing:border-box;z-index:-1;box-shadow:0 3px 8px rgba(0,0,0,.5)}
.tag{font-size:12px;background:var(--ink);color:#FAC775;padding:2px 10px;border-radius:10px;white-space:nowrap;border:1px solid #854F0B;max-width:120px;overflow:hidden;text-overflow:ellipsis}
.chip{position:absolute;top:22px;display:flex;align-items:center;gap:6px;background:var(--ink);color:#FAC775;padding:5px 12px;border-radius:14px;font-size:14px;font-weight:500;z-index:3;border:1px solid #854F0B;font-variant-numeric:tabular-nums}
.rb{position:absolute;top:22px;z-index:3;border-radius:50%;width:38px;height:38px;padding:0}
.bulb{animation:tw 1.1s ease-in-out infinite alternate}
@keyframes tw{from{opacity:1}to{opacity:.2}}
.cf{position:absolute;top:-14px;width:7px;height:12px;border-radius:2px;animation:fall linear forwards;z-index:11}
@keyframes fall{to{translate:0 580px;rotate:720deg}}
@keyframes jig{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-30px) rotate(-8deg)}75%{transform:translateX(30px) rotate(8deg)}}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:10;padding:16px}
.ovc{background:#1A1420;border-radius:12px;padding:1.5rem;text-align:center;max-width:380px;border:2px solid #FAC775;box-shadow:0 8px 24px rgba(0,0,0,.5);display:grid;gap:6px;justify-items:center}
#et{position:absolute;right:14px;bottom:16px;width:88px;height:88px;border-radius:50%;background:#A32D2D;color:#FFFDF7;border:6px dashed #FFFDF7;outline:3px solid #A32D2D;font-size:14px;font-weight:500;z-index:4;padding:0;line-height:1.2;box-shadow:0 4px 10px rgba(0,0,0,.5);flex-direction:column;gap:0}
.passbar{position:absolute;left:0;right:0;bottom:0;min-height:150px;z-index:9;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;padding:30px 14px 14px;background:linear-gradient(to bottom,rgba(12,5,7,0),rgba(12,5,7,.9) 28%,rgba(12,5,7,.96));border-radius:0 0 16px 16px}
.pbtext{display:grid;gap:2px;min-width:0;max-width:240px}
.pbtext b{font-size:17px;font-weight:600;color:#FAC775}
.pbtext span{font-size:13px;color:#F4EBD9}
.pbtext small{font-size:12px;color:#B4B2A9}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.chat{max-width:760px;margin:12px auto 0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:10px}
.chead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.clog{max-height:220px;min-height:60px;overflow-y:auto;display:grid;gap:6px;align-content:start;padding-right:4px}
.cm{background:#1a0d10;border:1px solid rgba(250,199,117,.14);border-radius:10px;padding:6px 10px;font-size:14px;max-width:88%;justify-self:start;min-width:0;overflow-wrap:anywhere}
.cm.me{justify-self:end;background:#2f1a10;border-color:rgba(250,199,117,.35)}
.cm b{color:var(--gold);font-weight:600;margin-right:6px;font-size:13px}
.cm .tr{padding:2px 8px;font-size:12px;margin-top:4px;border-radius:6px;display:flex}
.cm .tx{margin-top:4px;padding-top:4px;border-top:1px dashed rgba(250,199,117,.3);color:#E8DCC4;font-style:italic}
.badge{position:absolute;top:-4px;right:-4px;background:#E24B4A;color:#fff;border-radius:9px;font-size:11px;min-width:18px;height:18px;line-height:18px;padding:0 4px;font-weight:600}
.mrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mname{font-size:14px;min-width:0;overflow-wrap:anywhere;display:flex;gap:6px;align-items:center}
.mname b{color:var(--gold);font-weight:600}
.filebtn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;border:1px solid var(--gold);background:var(--gold);color:var(--ink);font-weight:600;cursor:pointer}
.filebtn:focus-within,.filebtn:hover{background:#ffd894}
input[type=range]{width:110px;padding:0;border:0;background:none;accent-color:var(--gold)}
.trow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid rgba(250,199,117,.12)}
.tcode{font-family:var(--display);color:var(--gold);font-size:20px;letter-spacing:3px;min-width:74px}
.tinfo{flex:1;min-width:0;display:grid}
.tinfo b{font-weight:600;overflow-wrap:anywhere}
.tinfo small{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
input[type=search]::-webkit-search-cancel-button{filter:invert(.8)}
.quick{display:flex;gap:4px}
.quick button{padding:4px 10px;font-size:13px;border-radius:14px}
.quick button[aria-pressed=true]{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.turnbar{position:absolute;left:50%;top:92px;transform:translateX(-50%);z-index:8;background:rgba(12,5,7,.88);border:1px solid #FAC775;color:#FAC775;border-radius:16px;padding:5px 14px;font-size:13px;font-weight:600;max-width:86%;text-align:center;pointer-events:none;animation:tbfade 2.6s ease-out forwards}
@keyframes tbfade{0%{opacity:0;translate:0 -6px}12%{opacity:1;translate:0 0}75%{opacity:1}100%{opacity:0}}
.callb{position:absolute;right:12px;bottom:112px;z-index:6;padding:5px 12px;font-size:13px;font-weight:700;border-radius:14px;background:#FAC775;color:#111;border:2px solid #FFFDF7;box-shadow:0 3px 8px rgba(0,0,0,.45)}
.callb.urge{animation:urge 1s ease-in-out infinite alternate}
@keyframes urge{from{transform:scale(1)}to{transform:scale(1.08)}}
.kadi{font-size:10px;font-weight:700;letter-spacing:.5px;background:#FAC775;color:#111;border-radius:8px;padding:1px 6px;text-transform:uppercase}
.chat.drawer{position:fixed;z-index:70;margin:0;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(390px,calc(100vw - 24px));max-height:min(72vh,560px);grid-template-rows:auto minmax(80px,1fr) auto auto;box-shadow:0 18px 40px rgba(0,0,0,.6);border-color:rgba(250,199,117,.45)}
.chat.drawer .clog{max-height:none;min-height:0}
.chat.drawer .chead{flex-wrap:wrap}
.cclose{margin-left:auto;padding:4px;border-radius:50%;width:34px;height:34px}
.fab{position:fixed;z-index:65;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:58px;height:58px;padding:0;border-radius:50%;background:var(--gold);color:var(--ink);border:2px solid #FFFDF7;box-shadow:0 8px 20px rgba(0,0,0,.5)}
.fab:hover:not(:disabled){background:#ffd894}
.fab{touch-action:none;cursor:grab}
.fab.dragging,.chat.drawer.dragging{cursor:grabbing;transition:none;opacity:.92}
.fab.dragging{transform:scale(1.08)}
.chat.drawer .chead{touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.chat.drawer{touch-action:none}
.chat.drawer .clog,.chat.drawer form{touch-action:auto}
.chat.drawer .chead::before{content:'';position:absolute;left:50%;top:5px;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:rgba(250,199,117,.35)}
.chat.drawer{padding-top:16px}
.fab .badge{top:-2px;right:-2px}
.flogo{position:absolute;left:50%;top:50%;width:46%;height:62%;transform:translate(-50%,-50%);object-fit:contain;opacity:.5;pointer-events:none;z-index:0;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.t3felt>*:not(.flogo){position:relative;z-index:1}
.t3felt>div[style*="position:absolute"]{position:absolute}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:5px 12px;font-size:13px;border-radius:14px}
.seg button[aria-pressed=true]{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.tplogo{position:absolute;left:50%;top:44px;transform:translateX(-50%);max-width:30%;max-height:40px;object-fit:contain;opacity:.6}
.tpmsg{position:absolute;left:0;right:0;top:38px;text-align:center;font-size:8px;letter-spacing:2px;color:rgba(250,199,117,.75)}
.pkwrap{position:absolute;z-index:1}
.board.three .pkwrap{transform:rotateX(34deg);transform-origin:50% 68%;transform-style:preserve-3d}
.board.four .pkwrap{transform:rotateX(calc(34deg + var(--tx,0deg))) rotateY(var(--ty,0deg));transition:transform .18s ease-out}
.pkrail{position:absolute;inset:0;border-radius:999px;padding:15px;background:linear-gradient(180deg,color-mix(in srgb,var(--wood) 70%,#fff) 0%,var(--wood) 40%,color-mix(in srgb,var(--wood) 70%,#000) 100%);box-shadow:inset 0 2px 3px rgba(255,255,255,.25),inset 0 -3px 6px rgba(0,0,0,.4),0 10px 0 color-mix(in srgb,var(--wood) 50%,#000),0 26px 32px rgba(0,0,0,.6);transform-style:preserve-3d}
.pkfelt{width:100%;height:100%;border-radius:999px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.22),inset 0 0 0 9px rgba(0,0,0,.08),inset 0 0 46px rgba(0,0,0,.28);transform-style:preserve-3d;color:#fff}
.pkfelt .dz{border-color:rgba(255,255,255,.55)}
.pkcup{position:absolute;width:18px;height:18px;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle at 50% 45%,#0b0f16 32%,#626e80 36%,#b3bfcd 58%,#3b4454 100%);box-shadow:0 2px 3px rgba(0,0,0,.5);z-index:2}
.pkword{text-align:center;font-size:10px;letter-spacing:3px;color:rgba(255,255,255,.6)}
.pkchip{width:12px;height:12px;border-radius:50%;background:#D7263D;border:2px dashed #fff;box-shadow:0 2px 2px rgba(0,0,0,.35)}
.pkmsg{background:rgba(12,18,30,.72);color:#fff;border-radius:8px;padding:4px 12px;font-size:13px;font-weight:500;max-width:72%;text-align:center;line-height:1.3;min-height:18px}
.pkseat{position:absolute;width:78px;height:78px;transform:translate(-50%,-50%);z-index:2;display:flex;align-items:center;justify-content:center}
.pkseat.gone{opacity:.4}
.pkinfo{position:absolute;top:calc(100% - 4px);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px;z-index:3;white-space:nowrap}
.pkinfo.side{top:50%;left:auto;right:calc(100% + 4px);transform:translateY(-50%)}
.pkinfo.beside{top:50%;left:calc(100% + 2px);transform:translateY(-50%);align-items:flex-start}
.board.three .pkseat{transform:translate(-50%,-50%) translateZ(6px)}
.board.three .pkinfo{transform:translateX(-50%) rotateX(-34deg) translateZ(24px);transform-origin:50% 0}
.board.three .pkinfo.side,.board.three .pkinfo.beside{transform:translateY(-50%) rotateX(-34deg) translateZ(24px);transform-origin:50% 50%}
.pkp{position:absolute;width:104px;transform:translate(-50%,-100%);transform-origin:50% 100%;z-index:2;pointer-events:none}
.pkfigs{position:absolute;inset:0;z-index:3;pointer-events:none}
.pkfigs .pkinfo{pointer-events:auto}
.pkp .pkfigf svg{display:block;width:100%;height:auto;filter:drop-shadow(0 8px 8px rgba(0,0,0,.45))}
.pkp.side{width:92px}
.pkp.narrow{width:66px}.pkp.narrow.side{width:58px}.pkp.narrow .pkinfo{transform:scale(.85);transform-origin:0 0}.pkp.narrow .pkinfo.under{transform:translateX(-50%) scale(.85);transform-origin:50% 0}
.pkme.narrow{width:112px}
.pkp.o-front,.pkp.o-left,.pkp.o-right{width:112px}.pkp.o-front{transform:translate(-50%,-88%)}.pkp.o-left{transform:translate(-92%,-50%)}.pkp.o-right{transform:translate(-8%,-50%)}
.pkp.narrow.o-front,.pkp.narrow.o-left,.pkp.narrow.o-right{width:62px}
.pkme{width:118px;transform:translate(-50%,-18%)}.pkme.narrow{width:84px}.pkme .pkfigf svg{display:block;width:100%;height:auto;filter:drop-shadow(0 6px 8px rgba(0,0,0,.45))}.pkme.turn .pkfigf svg{filter:drop-shadow(0 0 6px rgba(61,220,132,.95)) drop-shadow(0 0 14px rgba(61,220,132,.5))}

const conv=ps=>ps.filter(p=>p.kind==='viewer').map(p=>({id:p.peer,me:p.sameTab,pr:p.presence||{}}));
t.set=patch=>r.presence(patch).catch(e=>console.warn('presence',e));
t.onPeers=cb=>{t.cb=cb;if(t.last.length)cb(t.last)};
t.leave=()=>{try{r.leave()}catch(e){}};
r.onPeers(ch=>{const m=ch.peers.find(p=>p.sameTab);if(m)t.me=m.peer;t.last=conv(ch.peers);t.cb&&t.cb(t.last)},e=>netLost('The connection to the table closed ('+e.code+').'));

S.logoData=(()=>{const d=store.get('casino.logo');return d&&/^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(d)?d:null})();
if(!S.logoData&&S.theme.logo)S.theme.logo=null;if(S.logoData&&!S.theme.logo)S.theme.logo={k:'loc'};
function logoSrc(th){const L=th&&th.logo;if(!L)return null;
if(S.logoData&&(S.mode==='local'||S.isHost))return S.logoData;
if(L.k==='srv'&&S.mode==='lan'&&S.code)return `/api/logo?room=${encodeURIComponent(S.code)}&v=${L.v}`;
if(L.k==='ast')return '/_blob/'+L.id;return null}
function dataToBlob(d){const m=/^data:([^;]+);base64,(.*)$/.exec(d);const bin=atob(m[2]),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:m[1]})}
function logoNote(t){S.logoMsg=t;const n=document.getElementById('tlnote');if(n)n.textContent=t}
function readImage(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}
async function pickLogo(file,after){if(!file)return;
if(!/^image\//.test(file.type)){logoNote('Choose a picture file, such as a JPG or PNG.');return}
if(file.size>15*1024*1024){logoNote('That picture is too big. Pick one under 15 MB.');return}
logoNote('Preparing your picture…');
try{const img=await readImage(file);const keepClear=/png|webp|gif/.test(file.type),max=keepClear?360:480,sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
 const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(img.naturalWidth*sc));cv.height=Math.max(1,Math.round(img.naturalHeight*sc));cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
 let data=cv.toDataURL(keepClear?'image/png':'image/jpeg',.85);if(data.length>420000)data=cv.toDataURL('image/jpeg',.72);
 S.logoData=data;store.set('casino.logo',data);S.theme=cleanTheme({...S.theme,logo:{k:'loc'}});saveTheme();logoNote('');after();await shareLogo()}
catch(e){logoNote('That picture could not be opened. Try a JPG or PNG.')}}
async function shareLogo(){if(!S.logoData||!T||!S.isHost)return;const blob=dataToBlob(S.logoData);
if(S.mode==='lan'){try{const r=await fetch(`/api/logo?room=${encodeURIComponent(S.code)}&id=${T.me}`,{method:'POST',headers:{'content-type':blob.type},body:blob});if(!r.ok)throw r.status;const j=await r.json();
  S.theme=cleanTheme({...S.theme,logo:{k:'srv',v:+j.v}});saveTheme();logoNote('Your picture is shared with the table. Everyone sees it when you deal.')}
 catch(e){logoNote(e===413?'That picture is too big for the server. Try a smaller one.':'Could not share the picture. It still shows on your device.')}}
else if(S.mode==='online'){let as=null;try{as=window.claude&&window.claude.use?await window.claude.use('assets'):null}catch(e){}
 if(!as){logoNote('At online tables only the page owner can share a picture. It shows on your device.');return}
 try{const r=await as.upload(blob,{type:blob.type});S.theme=cleanTheme({...S.theme,logo:{k:'ast',id:r.id}});saveTheme();logoNote('Your picture is shared with the table. Everyone sees it when you deal.')}
 catch(e){logoNote('Could not share the picture. It still shows on your device.')}}}
/* The "Table look" panel: preset cards, then a few color pickers and the sign name. */
function themePanel(){const t=S.theme,P=themeOf(t);
return `<details class="rules tlook" ${S.tlookOpen?'open':''}><summary>Table look: <b>${esc(THEMES[t.id].name)}</b>${Object.keys(t.c).length?' (custom)':''}</summary>
<div class="tgrid">${Object.entries(THEMES).map(([k,v])=>`<button type="button" class="tcard" data-th="${k}" aria-pressed="${t.id===k}"><span class="tsw" style="background:linear-gradient(135deg,${v.carpet} 0 30%,${v.felt} 30% 70%,${v.trim} 70% 80%,${v.back} 80%)"></span><b>${esc(v.name)}</b><small>${esc(v.blurb)}</small></button>`).join('')}</div>
<div class="tcustom"><span class="lbl">Make it your own</span>
<div class="tcols">${[['felt','Table felt'],['carpet','Carpet'],['trim','Gold trim and lights'],['back','Card backs']].map(([k,l])=>`<label class="tcol"><input type="color" id="tc-${k}" value="${P[k]}"> ${l}</label>`).join('')}</div>
<label class="lbl" for="tsign">Casino sign</label><input id="tsign" maxlength="14" value="${esc(t.sign)}" placeholder="CASINO" autocomplete="off">
<button type="button" id="treset">Reset colors to ${esc(THEMES[t.id].name)}</button>
<span class="lbl">Your picture or logo on the table</span>
<div class="row"><label class="filebtn" for="tlogo">${ic('image',16)} ${t.logo&&S.logoData?'Change picture':'Choose picture'}</label><input type="file" id="tlogo" accept="image/*" hidden>${t.logo&&S.logoData?'<button type="button" id="tlogox">Remove picture</button>':''}</div>
<p class="note" id="tlnote" role="status">${esc(S.logoMsg||'')}</p>
<span class="lbl">Room style</span><div class="seg">${Object.entries(LAYOUTS).map(([k,l])=>`<button type="button" data-lay="${k}" aria-pressed="${t.layout===k}">${l}</button>`).join('')}</div>
<span class="lbl">Table shape${t.layout==='poker'?' (casino hall only)':''}</span><div class="seg">${Object.entries(SHAPES).map(([k,l])=>`<button type="button" data-shape="${k}" aria-pressed="${t.shape===k}">${l}</button>`).join('')}</div>
<span class="lbl">Felt pattern</span><div class="seg">${Object.entries(PATS).map(([k,l])=>`<button type="button" data-pat="${k}" aria-pressed="${t.pat===k}">${l}</button>`).join('')}</div>
<span class="lbl">On the table</span><div class="tcols">${[['slots','Slot machines'],['ropes','Rope posts'],['chips','Chip stacks']].map(([k,l])=>`<label class="chk"><input type="checkbox" data-deco="${k}" ${t.deco[k]?'checked':''}> ${l}</label>`).join('')}</div>
<label class="lbl" for="tmsg">Message on the felt</label><input id="tmsg" maxlength="26" value="${esc(t.msg)}" placeholder="FOUR CARDS TO WIN" autocomplete="off"></div>
<div class="tprev" aria-hidden="true" style="--felt:${P.felt};--carpet:${P.carpet};--trim:${P.trim};--back:${P.back}"><span class="tpsign" style="color:${P.bulb};border-color:${P.sign}">${esc(P.signText)}</span><span class="tpfelt" style="border-radius:${t.shape==='rect'?'16px 16px 0 0':'50%'};left:${t.shape==='round'?'28%':'18%'};right:${t.shape==='round'?'28%':'18%'};background-image:${FELT_PAT[t.pat]}"></span>${logoSrc(t)?`<img class="tplogo" src="${esc(logoSrc(t))}" alt="">`:''}<span class="tpmsg">${esc(t.msg||'FOUR CARDS TO WIN')}</span><span class="tpback bk" style="background-color:${P.back}"></span></div>
${T&&S.isHost?'<p class="note">Everyone at your table sees this look when you deal.</p>':''}</details>`}
function wireTheme(rerender){const d=app.querySelector('.tlook');if(!d)return;d.addEventListener('toggle',()=>{S.tlookOpen=d.open});
const after=()=>{saveTheme();rerender()};
app.querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>{const id=b.dataset.th;S.theme=cleanTheme({...S.theme,id,c:{}});after()});
app.querySelectorAll('[data-lay]').forEach(b=>b.onclick=()=>{S.theme=cleanTheme({...S.theme,layout:b.dataset.lay});after()});
app.querySelectorAll('[data-shape]').forEach(b=>b.onclick=()=>{S.theme=cleanTheme({...S.theme,shape:b.dataset.shape});after()});
app.querySelectorAll('[data-pat]').forEach(b=>b.onclick=()=>{S.theme=cleanTheme({...S.theme,pat:b.dataset.pat});after()});
app.querySelectorAll('[data-deco]').forEach(b=>b.onchange=()=>{S.theme=cleanTheme({...S.theme,deco:{...S.theme.deco,[b.dataset.deco]:b.checked?1:0}});saveTheme()});
const lf=document.getElementById('tlogo');if(lf)lf.onchange=()=>{const f=lf.files&&lf.files[0];lf.value='';pickLogo(f,after)};
const lx=document.getElementById('tlogox');if(lx)lx.onclick=()=>{S.logoData=null;try{localStorage.removeItem('casino.logo')}catch(e){}S.theme=cleanTheme({...S.theme,logo:null});logoNote('');after()};
const tm=document.getElementById('tmsg');if(tm)tm.oninput=()=>{S.theme=cleanTheme({...S.theme,msg:tm.value});saveTheme();const pm=d.querySelector('.tpmsg');if(pm)pm.textContent=S.theme.msg||'FOUR CARDS TO WIN'};
/* colors and sign update the panel in place, so the page is not rebuilt while you type or pick */
const live=()=>{saveTheme();const P=themeOf(S.theme),pv=d.querySelector('.tprev');if(pv){pv.style.setProperty('--felt',P.felt);pv.style.setProperty('--carpet',P.carpet);pv.style.setProperty('--trim',P.trim);
 const sgn=pv.querySelector('.tpsign');sgn.textContent=P.signText;sgn.style.color=P.bulb;sgn.style.borderColor=P.sign;pv.querySelector('.tpback').style.backgroundColor=P.back}
 const sm=d.querySelector('summary b');if(sm&&sm.nextSibling&&sm.nextSibling.nodeType===3)sm.nextSibling.nodeValue=Object.keys(S.theme.c).length?' (custom)':'';else if(sm&&Object.keys(S.theme.c).length)sm.after(' (custom)')};
['felt','carpet','trim','back'].forEach(k=>{const i=document.getElementById('tc-'+k);if(i)i.oninput=i.onchange=()=>{S.theme=cleanTheme({...S.theme,c:{...S.theme.c,[k]:i.value}});live()}});
const sg=document.getElementById('tsign');if(sg)sg.oninput=()=>{S.theme=cleanTheme({...S.theme,sign:sg.value});live()};
const rs=document.getElementById('treset');if(rs)rs.onclick=()=>{S.theme=cleanTheme({...S.theme,c:{}});after()}}

/* ---------- 4D: motion, vibration, light and room sound ---------- */
const noMotion=()=>window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function buzz(p){if(S.dim!==4||noMotion())return;try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
let tilt={x:0,y:0},tiltRaf=0;
function setTilt(x,y){tilt={x:Math.max(-1,Math.min(1,x)),y:Math.max(-1,Math.min(1,y))};if(tiltRaf)return;tiltRaf=requestAnimationFrame(()=>{tiltRaf=0;const r=document.documentElement.style;
 r.setProperty('--ty',(tilt.x*9).toFixed(2)+'deg');r.setProperty('--tx',(tilt.y*-6).toFixed(2)+'deg');r.setProperty('--px',(tilt.x*-10).toFixed(1)+'px');r.setProperty('--py',(tilt.y*-6).toFixed(1)+'px');setTimeout(placeFigures,200)})}
let oriOn=false;
function start4D(){if(oriOn)return;oriOn=true;
 const add=()=>window.addEventListener('deviceorientation',e=>{if(S.dim!==4||noMotion()||e.gamma==null)return;setTilt(e.gamma/30,((e.beta||45)-45)/30)});
 try{if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==='function')DeviceOrientationEvent.requestPermission().then(r=>{if(r==='granted')add()}).catch(()=>{});else add()}catch(e){}}
document.addEventListener('pointermove',e=>{if(S.dim!==4||noMotion()||e.pointerType==='touch'||S.view!=='game')return;const b=app.querySelector('.board');if(!b)return;const r=b.getBoundingClientRect();setTilt((e.clientX-r.left)/r.width*2-1,(e.clientY-r.top)/r.height*2-1)},{passive:true});
let amb=null;
function ambience(){const want=S.dim===4&&S.snd&&!noMotion();
 if(!want){if(amb){try{amb.g.gain.setTargetAtTime(0,AC.currentTime,.3);const a=amb;setTimeout(()=>{try{a.src.stop()}catch(e){}clearInterval(a.t)},900)}catch(e){}amb=null}return}
 if(amb||!ac())return;if(AC.state==='suspended')AC.resume().catch(()=>{});
 const len=AC.sampleRate*4,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);let last=0;for(let i=0;i<len;i++){last=last*.985+(Math.random()*2-1)*.06;d[i]=last}
 const src=AC.createBufferSource();src.buffer=buf;src.loop=true;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=420;f.Q.value=.6;
 const g=AC.createGain();g.gain.value=0;src.connect(f);f.connect(g);g.connect(AC.destination);src.start();g.gain.setTargetAtTime(.22,AC.currentTime,1.2);
 const t=setInterval(()=>{if(Math.random()<.5&&S.snd&&S.dim===4){const o=AC.createOscillator(),og=AC.createGain(),now=AC.currentTime,fr=[1046,1318,1568][Math.floor(Math.random()*3)];o.type='sine';o.frequency.value=fr;og.gain.setValueAtTime(0,now);og.gain.linearRampToValueAtTime(.025,now+.02);og.gain.exponentialRampToValueAtTime(.0005,now+1.2);o.connect(og);og.connect(AC.destination);o.start(now);o.stop(now+1.3)}},9000);
 amb={src,g,t}}
document.addEventListener('pointerdown',()=>{if(S.dim===4)ambience()},{once:true});

/* ---------- background music ---------- */
S.mu={el:null,file:null,type:'',loaded:false,name:'',v:0,listen:false,vol:(()=>{const v=parseFloat(store.get('casino.vol'));return v>=0&&v<=1?v:.5})(),hostMu:null,note:''};
const MU_EXT={mp3:'audio/mpeg',m4a:'audio/mp4',aac:'audio/aac',ogg:'audio/ogg',oga:'audio/ogg',opus:'audio/ogg',wav:'audio/wav',flac:'audio/flac',weba:'audio/webm'};
/* Songs picked on this device are decoded and played with Web Audio, which works even where the page may not load media files. */
const LP={buf:null,src:null,gain:null,off:0,t0:0,playing:false};
function lpGain(){const c=ac();if(!c)return null;if(!LP.gain){LP.gain=c.createGain();LP.gain.connect(c.destination)}LP.gain.gain.value=S.mu.vol;return LP.gain}
function lpPos(){if(!LP.buf)return 0;const d=LP.buf.duration||1,p=LP.playing?LP.off+(AC.currentTime-LP.t0):LP.off;return ((p%d)+d)%d}
function lpStopSrc(){if(LP.src){try{LP.src.onended=null;LP.src.stop()}catch(e){}try{LP.src.disconnect()}catch(e){}LP.src=null}}
function lpPlay(){if(!LP.buf||!ac())return;if(AC.state==='suspended')AC.resume().catch(()=>{});const off=lpPos();lpStopSrc();
const s=AC.createBufferSource();s.buffer=LP.buf;s.loop=true;s.connect(lpGain());s.start(0,off);LP.src=s;LP.off=off;LP.t0=AC.currentTime;LP.playing=true;muChanged()}
function lpPause(){if(!LP.playing)return;LP.off=lpPos();lpStopSrc();LP.playing=false;muChanged()}
async function lpLoad(file){if(!ac())throw new Error('noaudio');const ab=await file.arrayBuffer();
const buf=await new Promise((res,rej)=>{try{const p=AC.decodeAudioData(ab,res,rej);if(p&&p.then)p.then(res,rej)}catch(e){rej(e)}});
lpStopSrc();LP.playing=false;LP.buf=buf;LP.off=0}
function muChanged(){muBroadcast();renderMusic()}
/* Guests at a server table stream the host's song from the server with a normal audio element. */
function muEl(){if(!S.mu.el){const a=new Audio();a.loop=true;a.preload='auto';a.volume=S.mu.vol;S.mu.el=a;a.addEventListener('play',()=>renderMusic());a.addEventListener('pause',()=>renderMusic())}return S.mu.el}
const muGuest=()=>S.mode==='lan'&&!S.isHost&&!!T;
function muBroadcast(){if(S.mode!=='lan'||!S.isHost||!T)return;
T.set({mu:S.mu.v&&LP.buf?{v:S.mu.v,n:S.mu.name.slice(0,60),p:LP.playing?1:0,t:Math.round(lpPos()*10)/10,at:Date.now()}:null})}
async function pickSong(file){if(!file)return;S.mu.note='';
const ext=(file.name.split('.').pop()||'').toLowerCase(),type=/^audio\//.test(file.type)?file.type:MU_EXT[ext];
if(!type){S.mu.note='Choose an audio file, such as an MP3 or M4A.';return renderMusic()}
if(file.size>15*1024*1024){S.mu.note='Pick a song under 15 MB.';return renderMusic()}
S.mu.note='Loading the song…';renderMusic();
try{await lpLoad(file)}catch(e){S.mu.note=e&&e.message==='noaudio'?'This browser cannot play music here.':'This song could not be played. Try an MP3 file.';return renderMusic()}
S.mu.file=file;S.mu.type=type;S.mu.loaded=true;S.mu.v=0;S.mu.name=cleanText(file.name.replace(/\.[^.]+$/,'')).slice(0,60)||'Song';S.mu.note='';
lpPlay();if(AC.state!=='running')S.mu.note='Tap Play to start the music.';renderMusic();shareSong()}
async function shareSong(){if(!(S.mode==='lan'&&S.isHost&&T&&S.mu.file))return;S.mu.note='Sharing the song with the table…';renderMusic();
 try{const r=await fetch(`/api/music?room=${S.code}&id=${T.me}`,{method:'POST',headers:{'content-type':S.mu.type},body:S.mu.file});if(!r.ok)throw r.status;const j=await r.json();S.mu.v=+j.v||1;muBroadcast();S.mu.note='Shared. Players tap Listen to hear it.'}
 catch(e){S.mu.note=e===413?'That song is too big for the server. Pick one under 15 MB.':e===507?'The server is full right now. Try a smaller song.':'Could not share the song. It still plays on your device.'}
 renderMusic()}
function hostMusic(list){if(S.mode!=='lan'||S.isHost)return;const h=list.find(p=>p.pr&&p.pr.host&&!p.me);
const m=h&&h.pr.mu&&typeof h.pr.mu==='object'&&Number.isFinite(+h.pr.mu.v)?h.pr.mu:null;
if(JSON.stringify(m)===JSON.stringify(S.mu.hostMu))return;S.mu.hostMu=m;syncMusic();renderMusic()}
function syncMusic(){const m=S.mu.hostMu,a=muEl();if(!muGuest())return;
if(!m||!S.mu.listen){if(!a.paused)a.pause();return}
const src=`/api/music?room=${S.code}&v=${+m.v}`;
const pos=()=>{let p=+m.t||0;if(m.p)p+=Math.max(0,(Date.now()-(+m.at||Date.now()))/1000);if(a.duration&&isFinite(a.duration))p=p%a.duration;return p};
const seek=()=>{const p=pos();if(Math.abs((a.currentTime||0)-p)>3)try{a.currentTime=p}catch(e){}};
if(!a.src.endsWith(src)){a.src=src;a.addEventListener('loadedmetadata',seek,{once:true})}else seek();
if(m.p)a.play().catch(()=>{S.mu.note='Tap Listen again to start the music.';renderMusic()});else a.pause()}
function renderMusic(){const box=document.getElementById('music');if(!box)return;const g=muGuest(),m=S.mu.hostMu,playing=g?!!S.mu.el&&!S.mu.el.paused:LP.playing;
let body;
if(g){body=m?`<div class="mrow"><span class="mname">${ic('music',16)} Host is playing: <b>${esc(String(m.n||'a song'))}</b>${m.p?'':' (paused)'}</span>
<button id="mlisten" class="${S.mu.listen?'':'pri'}">${S.mu.listen?ic('mute',16)+' Stop listening':ic('vol',16)+' Listen'}</button></div>`
 :`<p class="note">The host has not picked any music yet.</p>`}
else body=`<div class="mrow"><label class="filebtn" for="mufile" id="mupick">${ic('music',16)} ${S.mu.loaded?'Change song':'Choose a song'}</label><input type="file" id="mufile" accept="audio/*,.mp3,.m4a,.aac,.ogg,.opus,.wav,.flac" hidden>
<button id="mplay" ${S.mu.loaded?'':'disabled'} aria-label="${playing?'Pause music':'Play music'}">${ic(playing?'pause':'play',16)} ${playing?'Pause':'Play'}</button>
${S.mu.loaded?`<span class="mname">${esc(S.mu.name)}</span>`:''}</div>`;
const sub=g?'':S.mode==='online'&&T?'At online tables the music plays on this device only.':S.mode==='lan'&&S.isHost?'Your song is shared with everyone at the table.':!T?'Pick a song from this device. At a Wi‑Fi or server table, the host’s song is shared with everyone.':'';
box.innerHTML=`<div class="chead"><span class="lbl" style="display:flex;gap:6px;align-items:center">${ic('music',16)} Background music</span>
<label class="note" style="display:flex;gap:6px;align-items:center" for="mvol">${ic('vol',14)} Volume <input type="range" id="mvol" min="0" max="1" step="0.05" value="${S.mu.vol}"></label></div>
${body}${sub?`<p class="note">${sub}</p>`:''}<p class="note" role="status">${esc(S.mu.note)}</p>`;
const pk=document.getElementById('mupick');if(pk)pk.addEventListener('click',()=>{const c=ac();if(c&&c.state==='suspended')c.resume().catch(()=>{})});
const f=document.getElementById('mufile');if(f)f.onchange=()=>{pickSong(f.files&&f.files[0]);f.value=''};
const pl=document.getElementById('mplay');if(pl)pl.onclick=()=>{const c=ac();if(c&&c.state==='suspended')c.resume().catch(()=>{});S.mu.note='';if(LP.playing)lpPause();else lpPlay()};
const li=document.getElementById('mlisten');if(li)li.onclick=()=>{S.mu.listen=!S.mu.listen;S.mu.note='';if(!S.mu.listen&&S.mu.el)S.mu.el.pause();syncMusic();renderMusic()};
document.getElementById('mvol').oninput=e=>{S.mu.vol=+e.target.value;if(S.mu.el)S.mu.el.volume=S.mu.vol;if(LP.gain)LP.gain.gain.value=S.mu.vol;store.set('casino.vol',String(S.mu.vol))}}
function initMusic(){const box=document.createElement('section');box.id='music';box.className='chat';box.setAttribute('aria-label','Background music');
(document.getElementById('chat')||app).after(box);renderMusic()}
function leaveMusic(){S.mu.hostMu=null;S.mu.listen=false;S.mu.v=0;if(S.mu.el){S.mu.el.pause();S.mu.el.removeAttribute('src')}S.mu.note='';renderMusic()}

/* detect what this copy of the page can do */
getRoom().then(()=>{if(S.view==='setup'&&S.tab==='online')setup()});
fetch('/api/ping').then(r=>r.ok?r.json():null).then(j=>{S.lan=!!(j&&j.casino);S.lanTr=!!(j&&j.tr);S.lanAdmin=!!(j&&j.admin);S.lanMu=!!(j&&j.mu);if(S.lan&&!store.get('casino.tab'))S.tab='lan'}).catch(()=>{S.lan=false}).finally(()=>{if(S.view==='setup')setup()});
initChat();initMusic();getSample().then(()=>renderChat(true));
window.addEventListener('pagehide',()=>{if(T)try{T.leave()}catch(e){}});
function placeFigures(){const b=app.querySelector('.board'),rail=b&&b.querySelector('.pkrail');if(!rail)return;
const fit=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--fit'))||1,br=b.getBoundingClientRect(),r=rail.getBoundingClientRect();
b.querySelectorAll('.pkfigs [data-ax]').forEach(el=>{el.style.left=((r.left+r.width*(+el.dataset.ax)-br.left)/fit).toFixed(1)+'px';el.style.top=((r.top+r.height*(+el.dataset.ay)-br.top)/fit).toFixed(1)+'px'})}
function fitBoard(){const vh=window.visualViewport?window.visualViewport.height:window.innerHeight;
const f=Math.max(.5,Math.min(1,(vh-20)/530));document.documentElement.style.setProperty('--fit',f.toFixed(3))}
window.addEventListener('resize',()=>{fitBoard();placeFigures()});window.addEventListener('orientationchange',()=>setTimeout(fitBoard,250));if(window.visualViewport)window.visualViewport.addEventListener('resize',fitBoard);fitBoard();
setup();
</script>
